services:
  app:
    container_name: peps-mail
    restart: unless-stopped
    build:
      context: .
      args:
        - NEXT_PUBLIC_BASE_PATH=${BASE_PATH:-}
    ports:
      # Plain HTTP: only reachable from this host by default, for the TLS reverse proxy.
      - "${PUBLISH_ADDRESS:-127.0.0.1}:3001:3001"
    environment:
      - BASE_PATH=${BASE_PATH:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - IMAP_HOST=${IMAP_HOST:?Set IMAP_HOST in .env}
      - IMAP_PORT=${IMAP_PORT:-993}
      - SMTP_HOST=${SMTP_HOST:?Set SMTP_HOST in .env}
      - SMTP_PORT=${SMTP_PORT:-587}
      - TLS_ENABLED=${TLS_ENABLED:-true}
      - RUST_LOG=${RUST_LOG:-info,tantivy=warn,async_imap=warn}
      - SESSION_TIMEOUT_HOURS=${SESSION_TIMEOUT_HOURS:-24}
      # Connections from the host's reverse proxy arrive via the Docker bridge.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      - ALLOW_ANY_SENDER=${ALLOW_ANY_SENDER:-false}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:3001${BASE_PATH:-}/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

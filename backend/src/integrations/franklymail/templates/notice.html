<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}}</title></head>
<body style="margin:0;padding:0;background-color:#f3f5f9;color:#17243b;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f5f9">
    <tr><td align="center" style="padding:32px 16px;">
      <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr><td style="padding:0 8px 20px;font-size:14px;font-weight:bold;letter-spacing:1px;color:#2457d6;">PEPS VBC MAIL</td></tr>
        <tr><td bgcolor="#ffffff" style="padding:32px 24px;border:1px solid #e2e7ef;border-radius:16px;">
          <h1 style="margin:0 0 20px;font-size:24px;line-height:32px;color:#17243b;">{{title}}</h1>
          <p style="margin:0 0 16px;font-size:16px;line-height:26px;">{{message}}</p>
          <p style="margin:0;font-size:14px;line-height:22px;color:#52627a;">Mailbox: <strong>{{mailbox}}</strong></p>
        </td></tr>
        <tr><td style="padding:20px 8px 0;font-size:13px;line-height:21px;color:#52627a;">If you expected this change, no action is needed. If you did not, contact your administrator straight away.</td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
